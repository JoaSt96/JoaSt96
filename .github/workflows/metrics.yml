name: Metrics

on:
  schedule:
    # Monthly: often enough to keep GitHub from disabling the schedule after 60 idle days.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Pinned to v3.34 by commit SHA so the action can't change under us.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: JoaSt96
          template: classic
          base: header, activity, repositories
          # Only count repositories owned by the account, never company orgs.
          repositories_affiliations: owner
          # Never list repository names from private activity.
          plugin_activity: no
          config_timezone: America/Argentina/Buenos_Aires
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
